name: Analyse index
run-name: Analyze index ${{ inputs.index }}

on:
  workflow_dispatch:
    inputs:
      index:
        description: Index alias from watchlists/indices.txt
        required: true
        type: choice
        options:
          - niftyauto
          - niftybank
          - niftycommodities
          - niftyconsumption
          - niftyenergy
          - niftyfmcg
          - niftyinfra
          - niftyit
          - niftymedia
          - niftymetal
          - niftymidcap150
          - niftynext50
          - nifty50
          - niftypharma
          - niftypsubank
          - niftyrealty
          - niftysmlcap250

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ inputs.index }} index
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate selected index
        env:
          INDEX_ALIAS: ${{ inputs.index }}
        run: |
          set -euo pipefail
          grep -Fxq "$INDEX_ALIAS" watchlists/indices.txt

      - name: Run index dashboard
        env:
          INDEX_ALIAS: ${{ inputs.index }}
        run: |
          set -o pipefail
          bash scripts/index_dashboard.sh "$INDEX_ALIAS"
