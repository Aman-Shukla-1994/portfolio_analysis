      - name: Send ${{ inputs.index }} email
        uses: dawidd6/action-send-mail@v21
        with:
          connection_url: smtp://${{ secrets.SMTP_USERNAME }}:${{ secrets.SMTP_PASSWORD }}@${{ secrets.SMTP_SERVER }}:${{ secrets.SMTP_PORT || 587 }}
          server_address: ${{ secrets.SMTP_ADDRESS }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: false
          require_tls: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Index dashboard: ${{ inputs.index }}"
          to: ${{ secrets.SMTP_USERNAME }}
          from: ${{ secrets.SMTP_USERNAME }}
          attachments: ${{ github.workspace }}/${{ inputs.index }}_dashboard.csv
          body: |
            Index: ${{ inputs.index }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

