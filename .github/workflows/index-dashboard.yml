name: Analyse index
run-name: Analyze index ${{ inputs.index }}

on:
  workflow_dispatch:
    inputs:
      index:
        description: Index alias from watchlists/indices.txt
        required: true
        type: choice
        options:
          - niftyauto
          - niftybank
          - niftycommodities
          - niftyconsumption
          - niftyenergy
          - niftyfmcg
          - niftyinfrastructure
          - niftyit
          - niftymedia
          - niftymetal
          - niftymidcap150
          - niftynext50
          - nifty50
          - niftypharma
          - niftypsubank
          - niftyrealty
          - niftysmallcap250

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ inputs.index }} index
    runs-on: ubuntu-latest
    env:
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT || 587 }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM || secrets.SMTP_USERNAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate selected index
        env:
          INDEX_ALIAS: ${{ inputs.index }}
        run: |
          set -euo pipefail
          grep -Fxq "$INDEX_ALIAS" watchlists/indices.txt

      - name: Run ${{ inputs.index }} dashboard
        env:
          INDEX_ALIAS: ${{ inputs.index }}
        run: |
          set -Eeuo pipefail
          bash scripts/index_dashboard.sh "$INDEX_ALIAS" "$GITHUB_WORKSPACE/${{ inputs.index }}_dashboard.csv"

      - name: Upload ${{ inputs.index }} CSV artifact
        uses: actions/upload-artifact@v4
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
        with:
          name: index-${{ inputs.index }}-csv
          path: ${{ github.workspace }}/${{ inputs.index }}_dashboard.csv
          if-no-files-found: error
          retention-days: 7

      - name: Send email
        if: ${{ env.SMTP_SERVER != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.EMAIL_TO != '' }}
        uses: dawidd6/action-send-mail@v21
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          secure: false
          tls: true
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "Index dashboard: ${{ inputs.index }}"
          to: ${{ env.EMAIL_TO }}
          from: ${{ env.EMAIL_FROM }}
          attachments: ${{ github.workspace }}/${{ inputs.index }}_dashboard.csv
          body: |
            Index: ${{ inputs.index }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Attached CSV file contains the latest computed values for this run.
