name: Analyse index
run-name: Analyze index ${{ inputs.all_indices == true && 'ALLINDICES' || inputs.index }}

on:
  workflow_dispatch:
    inputs:
      index:
        description: Index alias from watchlists/indices
        required: true
        type: choice
        options:
          - niftyauto
          - niftybank
          - niftycommodities
          - niftyconsumption
          - niftyenergy
          - niftyfmcg
          - niftyinfrastructure
          - niftyit
          - niftymedia
          - niftymetal
          - niftymidcap150
          - niftynext50
          - nifty50
          - niftypharma
          - niftypsubank
          - niftyrealty
          - niftysmallcap250
      all_indices:
        description: Run the dashboard for every index
        required: false
        type: boolean
        default: false
      send_email:
        description: Whether to send an email with the index dashboard XLSX attached
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ inputs.all_indices == true && 'ALLINDICES' || inputs.index }}
    runs-on: ubuntu-latest
    env:
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate selected index
        if: ${{ inputs.all_indices != true }}
        env:
          INDEX_ALIAS: ${{ inputs.index }}
        run: |
          set -euo pipefail
          grep -Fxq "$INDEX_ALIAS" watchlists/indices

      - name: Install XLSX export dependency
        run: python3 -m pip install --disable-pip-version-check openpyxl

      - name: Run selected index dashboard
        if: ${{ inputs.all_indices != true }}
        env:
          INDEX_ALIAS: ${{ inputs.index }}
        run: |
          set -Eeuo pipefail
          bash scripts/index_dashboard.sh "$INDEX_ALIAS" "$GITHUB_WORKSPACE/${{ inputs.index }}_dashboard.xlsx"

      - name: Run all index dashboards
        if: ${{ inputs.all_indices == true }}
        run: |
          set -Eeuo pipefail
          pids=()
          while IFS= read -r index_alias || [ -n "$index_alias" ]; do
            [ -z "$index_alias" ] && continue
            echo "Starting ${index_alias} dashboard"
            bash scripts/index_dashboard.sh "$index_alias" "$GITHUB_WORKSPACE/${index_alias}_dashboard.xlsx" &
            pids+=("$!")
          done < <(sed -e 's/\r$//' watchlists/indices)

          failed=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "One or more index dashboards failed."
            exit 1
          fi

      - name: Prepare dashboard email attachments
        run: |
          set -Eeuo pipefail
          attachments=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*_dashboard.xlsx' -printf '%p,' | sed 's/,$//')
          if [ -z "$attachments" ]; then
            echo "No dashboard workbooks were generated."
            exit 1
          fi
          echo "INDEX_ATTACHMENTS=$attachments" >> "$GITHUB_ENV"

      - name: Upload index XLSX artifact
        uses: actions/upload-artifact@v7
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
        with:
          name: index-dashboards-xlsx
          path: ${{ github.workspace }}/*_dashboard.xlsx
          if-no-files-found: error
          retention-days: 7

      - name: Report missing email configuration
        if: ${{ env.SMTP_SERVER == '' || env.SMTP_PORT == '' || env.SMTP_USERNAME == '' || env.SMTP_PASSWORD == '' || env.EMAIL_TO == '' || env.EMAIL_FROM == '' }}
        run: |
          echo "::warning::Email skipped. Configure repository secrets SMTP_SERVER, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, EMAIL_TO, and EMAIL_FROM."

      - name: Send email
        if: ${{ inputs.send_email == true && env.SMTP_SERVER != '' && env.SMTP_PORT != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.EMAIL_TO != '' && env.EMAIL_FROM != '' }}
        uses: dawidd6/action-send-mail@v21
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          secure: false
          require_tls: true
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "Index dashboards: ${{ inputs.all_indices == true && 'all' || inputs.index }}"
          to: ${{ env.EMAIL_TO }}
          from: ${{ env.EMAIL_FROM }}
          attachments: ${{ env.INDEX_ATTACHMENTS }}
          body: |
            Index: ${{ inputs.all_indices == true && 'all' || inputs.index }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Attached XLSX file(s) contain the latest computed values for this run.
