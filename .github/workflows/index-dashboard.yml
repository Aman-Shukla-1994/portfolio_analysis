name: Analyse index
run-name: Analyze index ${{ inputs.index }}

on:
  workflow_dispatch:
    inputs:
      index:
        description: Index alias from watchlists/indices.txt
        required: true
        type: choice
        options:
          - niftyauto
          - niftybank
          - niftycommodities
          - niftyindiaconsumption
          - niftyenergy
          - niftyfmcg
          - niftyinfrastructure
          - niftyit
          - niftymedia
          - niftymetal
          - niftymidcap150
          - niftynext50
          - nifty50
          - niftypharma
          - niftypsubank
          - niftyrealty
          - niftysmallcap250

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ inputs.index }} index
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate selected index
        env:
          INDEX_ALIAS: ${{ inputs.index }}
        run: |
          set -euo pipefail
          case "$INDEX_ALIAS" in
            niftysmlcap250|smallcap250|niftysmallcap250)
              INDEX_ALIAS="niftysmallcap250"
              ;;
            niftyindiaconsumption|indiaconsumption|niftyindiaconsumption)
              INDEX_ALIAS="niftyindiaconsumption"
              ;;
          esac
          grep -Fxq "$INDEX_ALIAS" watchlists/indices.txt

      - name: Run index dashboard
        env:
          INDEX_ALIAS: ${{ inputs.index }}
        run: |
          set -o pipefail
          case "$INDEX_ALIAS" in
            niftysmlcap250|smallcap250|niftysmallcap250)
              INDEX_ALIAS="niftysmallcap250"
              ;;
            niftyindiaconsumption|indiaconsumption|niftyindiaconsumption)
              INDEX_ALIAS="niftyindiaconsumption"
              ;;
          esac
          bash scripts/index_dashboard.sh "$INDEX_ALIAS" "$GITHUB_WORKSPACE/index_dashboard.csv"

      - name: Upload index CSV artifact
        uses: actions/upload-artifact@v4
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
        with:
          name: index-${{ inputs.index }}-csv
          path: ${{ github.workspace }}/index_dashboard.csv
          if-no-files-found: error

      - name: Check SMTP auth prerequisites
        if: ${{ env.SMTP_SERVER != '' || env.SMTP_USERNAME != '' || env.SMTP_PASSWORD != '' || env.EMAIL_TO != '' }}
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || 587 }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || secrets.SMTP_USERNAME }}
        run: |
          set -euo pipefail
          if [ -n "${SMTP_SERVER:-}" ] || [ -n "${SMTP_USERNAME:-}" ] || [ -n "${SMTP_PASSWORD:-}" ] || [ -n "${EMAIL_TO:-}" ]; then
            if [ "${SMTP_SERVER:-}" = "smtp.gmail.com" ] || [ "${SMTP_SERVER:-}" = "smtp-relay.gmail.com" ]; then
              echo "Gmail SMTP requires a Google App Password in SMTP_PASSWORD. SMTP_USERNAME must be the full Gmail address."
            fi
          fi

      - name: Send index email
        if: ${{ env.SMTP_SERVER != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.EMAIL_TO != '' }}
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || 587 }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME || secrets.EMAIL_FROM }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || secrets.SMTP_USERNAME }}
        uses: dawidd6/action-send-mail@v21
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "Index dashboard: ${{ inputs.index }}"
          to: ${{ env.EMAIL_TO }}
          from: ${{ env.EMAIL_FROM }}
          secure: false
          tls: true
          attachments: ${{ github.workspace }}/index_dashboard.csv
          body: |
            Index: ${{ inputs.index }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Attached CSV file contains the latest computed values for this run.
