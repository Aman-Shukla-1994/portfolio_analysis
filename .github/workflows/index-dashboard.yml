      #     if [ -n "${SMTP_SERVER:-}" ] || [ -n "${SMTP_USERNAME:-}" ] || [ -n "${SMTP_PASSWORD:-}" ] || [ -n "${EMAIL_TO:-}" ]; then
      #       if [ "${SMTP_SERVER:-}" = "smtp.gmail.com" ] || [ "${SMTP_SERVER:-}" = "smtp-relay.gmail.com" ]; then
      #         if [ -n "${SMTP_USERNAME:-}" ] && [[ "${SMTP_USERNAME}" != *"@"* ]]; then
      #           echo "Gmail SMTP requires SMTP_USERNAME to be the full Gmail address, not a display name or alias."
      #           echo "Also set SMTP_PASSWORD to the Gmail App Password (not your normal password)."
      #           exit 1
