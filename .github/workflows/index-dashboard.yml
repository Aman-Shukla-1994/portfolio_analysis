name: Analyse index
run-name: Analyze index ${{ inputs.index }}

on:
  workflow_dispatch:
    inputs:
      index:
        description: Index alias from watchlists/indices.txt
        required: true
        type: choice
        options:
          - niftyauto
          - niftybank
          - niftycommodities
          - niftyconsumption
          - niftyenergy
          - niftyfmcg
          - niftyinfrastructure
          - niftyit
          - niftymedia
          - niftymetal
          - niftymidcap150
          - niftynext50
          - nifty50
          - niftypharma
          - niftypsubank
          - niftyrealty
          - niftysmallcap250

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ inputs.index }} index
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate selected index
        env:
          INDEX_ALIAS: ${{ inputs.index }}
        run: |
          set -euo pipefail
          grep -Fxq "$INDEX_ALIAS" watchlists/indices.txt

      - name: Run ${{ inputs.index }} dashboard
        env:
          INDEX_ALIAS: ${{ inputs.index }}
        run: |
          set -Eeuo pipefail
          bash scripts/index_dashboard.sh "$INDEX_ALIAS" "$GITHUB_WORKSPACE/${{ inputs.index }}_dashboard.csv"

      - name: Upload ${{ inputs.index }} CSV artifact
        uses: actions/upload-artifact@v4
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
        with:
          name: index-${{ inputs.index }}-csv
          path: ${{ github.workspace }}/${{ inputs.index }}_dashboard.csv
          if-no-files-found: error
          retention-days: 7

      # - name: Check SMTP auth prerequisites
      #   if: ${{ env.SMTP_SERVER != '' || env.SMTP_USERNAME != '' || env.SMTP_PASSWORD != '' || env.EMAIL_TO != '' }}
