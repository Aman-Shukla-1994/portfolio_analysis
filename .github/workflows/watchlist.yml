name: Analyze watchlist
run-name: Analyze ${{ inputs.watchlist }}

on:
  workflow_dispatch:
    inputs:
      watchlist:
        description: Watchlist to analyze
        required: true
        type: choice
        options:
          - indices.txt
          - defence.txt
          - dividendStocks.txt
          - globalIndices.txt
          - holdings.txt
          - ipo.txt
          - etfs.txt

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ inputs.watchlist }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run dashboard
        env:
          WATCHLIST: ${{ inputs.watchlist }}
        run: |
          set -o pipefail
          bash scripts/watchlist.sh "watchlists/$WATCHLIST"
