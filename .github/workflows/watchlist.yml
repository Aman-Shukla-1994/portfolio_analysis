name: Analyze watchlist
run-name: Analyze ${{ inputs.watchlist }}

on:
  workflow_dispatch:
    inputs:
      watchlist:
        description: Watchlist to analyze
        required: true
        type: choice
        options:
          - dividendStocks.txt
          - etfs.txt
          - globalIndices.txt
          - holdings.txt
          - indices.txt
          - ipo.txt
      color_coding:
        description: Send an email with the generated CSV when enabled
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ inputs.watchlist }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run dashboard and export CSV
        env:
          WATCHLIST: ${{ inputs.watchlist }}
        run: |
          set -o pipefail
          bash scripts/watchlist.sh "watchlists/$WATCHLIST" "$GITHUB_WORKSPACE/watchlist.csv"

      - name: Upload watchlist CSV artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchlist-${{ inputs.watchlist }}-csv
          path: ${{ github.workspace }}/watchlist.csv
          if-no-files-found: error

      - name: Send watchlist email
        if: ${{ inputs.color_coding == true && env.SMTP_SERVER != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.EMAIL_TO != '' }}
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || 587 }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || secrets.SMTP_USERNAME }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "Watchlist analysis: ${{ inputs.watchlist }}"
          to: ${{ env.EMAIL_TO }}
          from: ${{ env.EMAIL_FROM }}
          secure: false
          tls: true
          attachments: ${{ github.workspace }}/watchlist.csv
          body: |
            Watchlist: ${{ inputs.watchlist }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Color-coding enabled: ${{ inputs.color_coding }}

            Attached CSV file contains the latest computed values for this run.
