name: Analyze watchlist
run-name: Analyze ${{ inputs.watchlist }}

on:
  workflow_dispatch:
    inputs:
      watchlist:
        description: Watchlist to analyze
        required: true
        type: choice
        options:
          - dividendStocks
          - etfs
          - holdings
          - ipo
          - pharma
      send_email:
        description: Whether to send an email with the watchlist dashboard XLSX attached
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ inputs.watchlist }}
    runs-on: ubuntu-latest
    env:
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install XLSX export dependency
        run: python3 -m pip install --disable-pip-version-check openpyxl

      - name: Run ${{ inputs.watchlist }} dashboard and export XLSX
        env:
          WATCHLIST: ${{ inputs.watchlist }}
        run: |
          set -o pipefail
          bash scripts/watchlist.sh "watchlists/$WATCHLIST" "$GITHUB_WORKSPACE/${{ inputs.watchlist }}.xlsx"

      - name: Upload ${{ inputs.watchlist }} XLSX artifact
        uses: actions/upload-artifact@v7
        with:
          name: watchlist-${{ inputs.watchlist }}-xlsx
          path: ${{ github.workspace }}/${{ inputs.watchlist }}.xlsx
          if-no-files-found: error

      - name: Report missing email configuration
        if: ${{ env.SMTP_SERVER == '' || env.SMTP_PORT == '' || env.SMTP_USERNAME == '' || env.SMTP_PASSWORD == '' || env.EMAIL_TO == '' || env.EMAIL_FROM == '' }}
        run: |
          echo "::warning::Email skipped. Configure repository secrets SMTP_SERVER, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, EMAIL_TO, and EMAIL_FROM."

      - name: Send watchlist email
        if: ${{ inputs.send_email == true && env.SMTP_SERVER != '' && env.SMTP_PORT != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.EMAIL_TO != '' && env.EMAIL_FROM != '' }}
        uses: dawidd6/action-send-mail@v21
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          secure: false
          require_tls: true
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "Watchlist analysis: ${{ inputs.watchlist }}"
          to: ${{ env.EMAIL_TO }}
          from: ${{ env.EMAIL_FROM }}
          attachments: ${{ github.workspace }}/${{ inputs.watchlist }}.xlsx
          body: |
            Watchlist: ${{ inputs.watchlist }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Attached XLSX file contains the latest computed values for this run.
