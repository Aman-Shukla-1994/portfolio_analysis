name: Analyze single symbol

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: Stock or index symbol, for example BSE or NIFTY
        required: true
        type: string

run-name: Analyze ${{ inputs.symbol }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ inputs.symbol }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tranche calculator
        env:
          GH_TOKEN: ${{ github.token }}
          SYMBOL: ${{ inputs.symbol }}
        run: |
          set -o pipefail
          SYMBOL=$(printf '%s' "${SYMBOL}" | tr '[:lower:]' '[:upper:]')
          bash tranches.sh "${SYMBOL}"
