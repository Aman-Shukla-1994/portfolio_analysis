name: Run watchlist dashboard

on:
  workflow_dispatch:
    inputs:
      watchlist:
        description: Watchlist to analyze
        required: true
        type: choice
        options:
          - indices.txt
          - holdings.txt
          - investlist.txt
          - ipo.txt
          - dividendStocks.txt
          - globalndices.txt

run-name: Analyze ${{ inputs.watchlist }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze selected watchlist
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run dashboard
        env:
          WATCHLIST: ${{ inputs.watchlist }}
        run: |
          set -o pipefail
          bash scripts/read_file.sh "$WATCHLIST"
