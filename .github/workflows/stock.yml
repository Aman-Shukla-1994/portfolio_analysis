name: Analyze stocks
run-name: Analyze ${{ inputs.symbols }}

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: Comma-separated stock or index symbols, for example RELIANCE, TCS, NIFTY
        required: true
        type: string

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ inputs.symbols }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run stock analysis
        env:
          GH_TOKEN: ${{ github.token }}
          SYMBOLS: ${{ inputs.symbols }}
        run: |
          set -o pipefail

          IFS=',' read -r -a SYMBOL_LIST <<< "${SYMBOLS}"

          for raw_symbol in "${SYMBOL_LIST[@]}"; do
            symbol="$(echo "${raw_symbol}" | xargs | tr '[:lower:]' '[:upper:]')"

            if [ -z "${symbol}" ]; then
              continue
            fi

            echo "============================================================"
            echo "Running stock.sh for: ${symbol}"
            echo "============================================================"
            bash scripts/stock.sh "${symbol}"
            echo
          done
